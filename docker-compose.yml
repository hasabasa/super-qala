services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: smartqala
      POSTGRES_PASSWORD: smartqala
      POSTGRES_DB: smartqala
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartqala"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: smartqala
      MINIO_ROOT_PASSWORD: smartqala123
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]

  api:
    build: ./backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    env_file: .env
    ports: ["8000:8000"]
    volumes: ["./backend:/app"]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}

volumes:
  pgdata:
  miniodata:
